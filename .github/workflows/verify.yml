# Copyright (c) 2026 the contributors to this fork.
#
# Verification for this fork.
#
# Upstream's own workflows (build.yml, dev.yml, codeql.yml, clang-analyzer.yml,
# pages.yml, scorecards.yml, sync.yml, cifuzz.yml) are kept untouched and still
# describe how upstream tests PCRE2 with autotools and CMake. This file is
# separate from them on purpose: it names this repository's gates, and it is
# written for this repository rather than retargeted from another maintainer's
# infrastructure.
#
# Jobs, and the question each one asks:
#
#   native          does the full in-tree core build; do the *installed*
#                   pcre2.h and pcre2posix.h compile, link and run against the
#                   *installed* core and POSIX wrapper; do the behavioural
#                   tests pass in Debug and ReleaseSafe; does the smoke program
#                   produce its output on this host
#   installed-bin   do the installed programs run from the installed prefix with
#                   no help from LD_LIBRARY_PATH - which is what proves the
#                   $ORIGIN runpath this build writes - and does a shared
#                   pcre2test really name libpcre2-8.so.0 rather than a path in
#                   a build cache
#   metadata        do the installed .pc files and pcre2-config describe the
#                   artifacts that were actually installed, with the right
#                   Requires.private and the right enabled widths
#   static          the same installed-bin gate against `-Dlinkage=static`,
#                   where the answers are an archive and no runpath at all
#   widths          do `-Dcode-unit-width=16` and `=32` install that width's
#                   library, header, .pc and programs, refuse the widths that
#                   build did not produce, and run test/smoke against the
#                   facade resolved for that width
#   upstream-suite  does upstream's own RunTest suite pass against this build's
#                   pcre2test, over upstream's own testdata
#   cross           does the core, the facade, the tests and the smoke compile
#                   and link for each of the six supported targets, without
#                   running them
#   system          does -fsys=pcre2-8 bind the facade to an installed PCRE2
#                   that is a different release from the one in this tree, which
#                   is the only way to tell the two apart
#   consumer        does the published module resolve from a package that did
#                   not write it, under each linkage
#
# Nothing here needs the network once checkout and the toolchain are in place.
# build.zig.zon has no `.dependencies`, so there is nothing for Zig to fetch,
# no job installs a package manager, and no job downloads a tarball. The one
# exception is the `system` job, whose whole purpose is a library that is
# installed on the machine; it is named separately so that "the default build
# needs no network" stays a statement about the default build.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: native build, tests and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: immutable native source and fixture integrity
        run: sha256sum -c UPSTREAM.sha256

      - name: build
        run: zig build --summary all

      # The real gate for the installed C surface.
      #
      # This translation unit includes the *installed* headers, so it sees the
      # header a dependent gets rather than anything this build graph put on its
      # own include path, and it links the *installed* libraries by name through
      # -l, so a declaration whose signature disagrees with the compiled
      # definition fails to link. It runs, and the offsets it checks are worked
      # out by hand below.
      #
      # Two -l names, because the POSIX wrapper is a second installed artifact
      # and not a synonym for the core: `zig build` installs libpcre2-8 and
      # libpcre2-posix side by side, `src/pcre2posix.c` is what defines
      # pcre2_regcomp, pcre2_regexec and pcre2_regfree, and
      # `src/pcre2posix.h:165-168` defines the POSIX spellings as macros for
      # those three. So the only names a caller may use through that header are
      # the four the header declares, and a call to anything else is a mistake
      # in the program rather than a fact about this fork; -Werror makes the
      # compile refuse it there, where the diagnostic names the call, instead
      # of letting an undeclared name through to a link error about a symbol
      # that was never going to be there. A glibc target builds these two
      # libraries dynamically by default, and both are named on the link line
      # in that order, so the run below binds the installed objects found
      # through LD_LIBRARY_PATH rather than whatever the runner image ships.
      #
      # `PCRE2_CODE_UNIT_WIDTH=8` is the one macro the application has to supply:
      # `pcre2.h.generic:1057-1059` hard-errors without it. It is the same value
      # this fork builds with, and the guard in `src/pcre2.h.generic` means the
      # rest of the header is self-sufficient for an application: no config.h
      # is needed to use the installed library.
      #
      # `-I zig-out/include` also proves the installed header tree is
      # self-sufficient: `b.addWriteFiles` put the generated copy in the build
      # cache, and nothing under `src/` is on this command line.
      - name: installed headers compile, link and run against the installed libraries
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/c_surface_gate.c" <<'C'
          #include <pcre2.h>
          #include <pcre2posix.h>
          #include <stdio.h>
          #include <string.h>

          /* Not volatile: nothing here is deleted by an optimizer, because the
             program's only output is its exit status and the compile and the
             link are themselves part of the gate. */

          /* Worked out by hand, not observed from a run.
             Pattern  (?<letters>a+)(?<digits>\d+)\z  against  "aaa123".
             "aaa" is the longest run of a's that leaves the rest to \d+, so
             group 1 spans [0,3); the \d+ that follows spans [3,6); \z pins the
             end, so the whole match is [0,6). A correct implementation returns
             3: the match itself plus the two capturing groups. */
          static int pcre2_gate(void) {
              int errcode = 0;
              PCRE2_SIZE erroffset = 0;
              pcre2_code *re = pcre2_compile(
                  (PCRE2_SPTR)"(?<letters>a+)(?<digits>\\d+)\\z",
                  PCRE2_ZERO_TERMINATED, 0, &errcode, &erroffset, NULL);
              if (re == NULL) return 10;

              pcre2_match_data *md = pcre2_match_data_create_from_pattern(re, NULL);
              if (md == NULL) { pcre2_code_free(re); return 11; }

              static const PCRE2_UCHAR subject[] = "aaa123";
              const int rc = pcre2_match(re, subject, sizeof subject - 1, 0, 0, md, NULL);
              if (rc != 3) { pcre2_match_data_free(md); pcre2_code_free(re); return 12; }

              /* The six numbers read below are three offset pairs: the whole
                 match and the two groups. The count is the capacity those reads
                 rest on rather than the number of groups this pattern happens
                 to have, so it is checked as the lower bound they need: a
                 library that reported fewer pairs would make the loop read
                 past the end of the allocation. */
              if (pcre2_get_ovector_count(md) < 3) {
                  pcre2_match_data_free(md); pcre2_code_free(re); return 13;
              }

              const PCRE2_SIZE *ov = pcre2_get_ovector_pointer(md);
              const PCRE2_SIZE want[6] = { 0, 6, 0, 3, 3, 6 };
              for (int i = 0; i < 6; i++) {
                  if (ov[i] != want[i]) { pcre2_match_data_free(md); pcre2_code_free(re); return 14; }
              }

              /* The name "digits" was defined on the second capturing group, so
                 the compiled pattern has to report it as group 2. This reads the
                 pattern's own name table rather than the match, so it fails for
                 a library that mis-parsed the pattern even if the offsets were
                 somehow right. */
              if (pcre2_substring_number_from_name(re, (PCRE2_SPTR)"digits") != 2) {
                  pcre2_match_data_free(md); pcre2_code_free(re); return 15;
              }

              /* Group 2 is "123", so the copy is three characters and needs a
                 fourth byte for the NUL it is terminated with. glen arrives as
                 the size of the buffer the caller owns and leaves as the number
                 of characters copied, NUL excluded, so a capacity under four is
                 PCRE2_ERROR_NOMEMORY with nothing copied at all: the capacity in
                 hand is sizeof group, and the NUL is checked where it landed. */
              PCRE2_UCHAR group[8];
              PCRE2_SIZE glen = sizeof group;
              if (pcre2_substring_copy_bynumber(md, 2, group, &glen) != 0 ||
                  glen != 3 || memcmp(group, "123", 3) != 0 || group[3] != 0) {
                  pcre2_match_data_free(md); pcre2_code_free(re); return 16;
              }

              /* The same capture under the other ownership rule: this call
                 allocates, so the string is the caller's until it goes back to
                 the library, and neither the NUL terminator nor the release can
                 be observed through the copy above. */
              PCRE2_UCHAR *owned = NULL;
              if (pcre2_substring_get_bynumber(md, 2, &owned, &glen) != 0 ||
                  glen != 3 || strcmp((const char *)owned, "123") != 0) {
                  pcre2_substring_free(owned);
                  pcre2_match_data_free(md); pcre2_code_free(re); return 17;
              }
              pcre2_substring_free(owned);

              pcre2_match_data_free(md);
              pcre2_code_free(re);
              return 0;
          }

          /* \p{Greek} is answered from the UCD tables that were compiled into
             the library, and a build without them rejects the escape at
             compile time rather than matching nothing, so this asks a question
             about characters instead of asking the library what it was
             configured with. PCRE2_UTF makes each character in the subject one
             code unit, and PCRE2_UCP is the Unicode property mode \p needs. */
          static int unicode_gate(void) {
              int errcode = 0;
              PCRE2_SIZE erroffset = 0;
              pcre2_code *re = pcre2_compile(
                  (PCRE2_SPTR)"\\p{Greek}+", PCRE2_ZERO_TERMINATED, PCRE2_UTF | PCRE2_UCP,
                  &errcode, &erroffset, NULL);
              if (re == NULL) return 20;

              /* One offset pair, the whole match. Nothing wider is read. */
              pcre2_match_data *md = pcre2_match_data_create(1, NULL);
              if (md == NULL) { pcre2_code_free(re); return 21; }

              /* U+03B1 alpha and U+03B2 beta are 0xCE 0xB1 and 0xCE 0xB2 in
                 UTF-8: two characters in four bytes, and the one-or-more takes
                 both, so the whole match is [0,4). A library that counted bytes,
                 or matched one character where the pattern says one or more,
                 reports something else here. */
              static const PCRE2_UCHAR greek[] = "\xce\xb1\xce\xb2";
              if (pcre2_match(re, greek, sizeof greek - 1, 0, 0, md, NULL) != 1) {
                  pcre2_match_data_free(md); pcre2_code_free(re); return 22;
              }
              const PCRE2_SIZE *ov = pcre2_get_ovector_pointer(md);
              if (ov[0] != 0 || ov[1] != 4) {
                  pcre2_match_data_free(md); pcre2_code_free(re); return 23;
              }

              /* U+4E2D is a Han character: one character in three bytes, and in
                 no Greek script. Whatever is finer than "not ASCII" has to
                 refuse it, so this is the negative a match-only version of this
                 gate would not have had. */
              static const PCRE2_UCHAR han[] = "\xe4\xb8\xad";
              if (pcre2_match(re, han, sizeof han - 1, 0, 0, md, NULL) != PCRE2_ERROR_NOMATCH) {
                  pcre2_match_data_free(md); pcre2_code_free(re); return 24;
              }

              pcre2_match_data_free(md);
              pcre2_code_free(re);
              return 0;
          }

          /* The POSIX wrapper is a second installed artifact with its own
             installed header: `src/pcre2posix.h:159-168` declares
             pcre2_regcomp, pcre2_regexec and pcre2_regfree and defines the
             POSIX spellings as macros for them, so regcomp, regexec and regfree
             below are the only names that header licenses, and they resolve in
             libpcre2-posix. `^a+$` against "aaa" is three a's and nothing else,
             so the wrapper reports the whole match as the byte range [0,3), and
             against "aaab" it has to refuse. */
          static int posix_gate(void) {
              regex_t re;
              if (regcomp(&re, "^a+$", REG_EXTENDED) != 0) return 30;

              regmatch_t pmatch[1];
              if (regexec(&re, "aaa", 1, pmatch, 0) != 0) { regfree(&re); return 31; }
              if (pmatch[0].rm_so != 0 || pmatch[0].rm_eo != 3) { regfree(&re); return 32; }

              /* "aaab" is not a run of a's with nothing after it, and
                 REG_NOMATCH is the wrapper's own value rather than the 0 a
                 successful regexec returns, so a wrapper that reported every
                 subject as a match cannot answer 0 here. */
              if (regexec(&re, "aaab", 1, pmatch, 0) != REG_NOMATCH) { regfree(&re); return 33; }

              regfree(&re);
              return 0;
          }

          int main(void) {
              const int a = pcre2_gate();
              const int b = unicode_gate();
              const int c = posix_gate();
              printf("pcre2 C gate: match=%d unicode=%d posix=%d\n", a, b, c);
              return a || b || c;
          }
          C
          #
          # Three link lines, one program, because each answers a different
          # question about where the POSIX entry points are:
          #
          #   -lpcre2-8 alone                 the runtime provider case: the core
          #                                    library must export all four
          #                                    POSIX names by itself, since a
          #                                    loader cannot find them in a library
          #                                    it never opened and Windows
          #                                    GetProcAddress does not search a
          #                                    dependency's dependencies.
          #   -lpcre2-posix -lpcre2-8         upstream's documented order: the
          #                                    separate wrapper still resolves.
          #   -lpcre2-8 -lpcre2-posix         the reverse order, so neither
          #                                    artifact is silently unused and a
          #                                    duplicate symbol would be reported
          #                                    rather than absorbed.
          for libs in "-lpcre2-8" "-lpcre2-posix -lpcre2-8" "-lpcre2-8 -lpcre2-posix"; do
            zig cc -std=c11 -Wall -Wextra -Werror \
              -DPCRE2_CODE_UNIT_WIDTH=8 \
              -I zig-out/include \
              "$RUNNER_TEMP/c_surface_gate.c" \
              -L zig-out/lib $libs \
              -o "$RUNNER_TEMP/c_surface_gate"
            LD_LIBRARY_PATH=zig-out/lib "$RUNNER_TEMP/c_surface_gate"
          done

      # Debug and ReleaseSafe are the two modes the gates above are run in: the
      # first catches a C object that is only instrumented in one of them and the
      # second is where an optimization can hide a bounds mistake.
      - name: test (Debug)
        run: zig build test --summary all

      - name: test (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe --summary all

      - name: smoke
        run: zig build smoke --summary all

  installed-bin:
    name: installed programs run from the installed prefix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The failure this job exists to catch is the one a build-tree run cannot
      # see. `Step.Compile` puts `-rpath <build-cache-dir>` in every program it
      # links, and that directory is gone once the cache is; an installed
      # `bin/pcre2test` with only that runpath loads nothing at all. This
      # build writes `$ORIGIN/../lib` for exactly this reason, and LD_LIBRARY_PATH
      # is deliberately absent below so that the runpath is the only thing that
      # can resolve the dependency.
      - name: "build (default linkage: dynamic on this runner's glibc)"
        run: zig build --summary all

      - name: shared objects carry upstream's libtool sonames
        run: |
          set -euo pipefail
          # configure.ac:16-19 gives libpcre2_8_version=16:1:16 and
          # libpcre2_posix_version=3:9:0, so soversion is current-age: 0 and 3.
          ls zig-out/lib/libpcre2-8.so.0.16.1
          ls zig-out/lib/libpcre2-posix.so.3.0.9
          # The sonames the loader will be asked for, and the two symlinks a
          # linker resolves -l through.
          readelf -d zig-out/lib/libpcre2-8.so.0.16.1 | grep -F 'SONAME' | grep -F 'libpcre2-8.so.0'
          readelf -d zig-out/lib/libpcre2-posix.so.3.0.9 | grep -F 'SONAME' | grep -F 'libpcre2-posix.so.3'
          test -L zig-out/lib/libpcre2-8.so.0
          test -L zig-out/lib/libpcre2-8.so
          test -L zig-out/lib/libpcre2-posix.so.3
          test -L zig-out/lib/libpcre2-posix.so

      # The runtime route can only work if the four POSIX entry points are in the
      # CORE library, not only in the separate wrapper: `dlopen`/`dlsym` do not
      # find a symbol in a library that was never opened, and Windows
      # `GetProcAddress` does not search a dependency's dependencies. This is the
      # gate for the whole provider surface, and it is where a missing export
      # shows up as a file that has the symbol but no dynamic entry for it.
      #
      # `local: *;` in the generated version script hides every symbol the
      # `global:` list does not name, so `nm -D` is the only honest check here:
      # the source file being in the archive would not show up.
      - name: the POSIX entry points are exported from the core library
        run: |
          set -euo pipefail
          for sym in pcre2_regcomp pcre2_regerror pcre2_regexec pcre2_regfree; do
            nm -D --defined-only zig-out/lib/libpcre2-8.so.0.16.1 | grep -F "$sym"
          done
          # ...and at the version node src/libpcre2-posix.sym.in uses, so the two
          # libraries answer at the same version for the same four functions.
          nm -D --defined-only zig-out/lib/libpcre2-8.so.0.16.1 \
            | grep -F 'pcre2_regcomp@@PCRE2_10.47'
          # The separate wrapper still exports them itself; this build does not
          # replace it, because -lpcre2-posix is upstream's public name for it.
          nm -D --defined-only zig-out/lib/libpcre2-posix.so.3.0.9 \
            | grep -F 'pcre2_regcomp@@PCRE2_10.47'

      - name: DT_NEEDED and RUNPATH of the installed pcre2test
        run: |
          set -euo pipefail
          readelf -d zig-out/bin/pcre2test
          # The sonames, not the build-cache paths they were linked against.
          readelf -d zig-out/bin/pcre2test | grep -F '(NEEDED)' | grep -F 'libpcre2-8.so.0'
          readelf -d zig-out/bin/pcre2test | grep -F '(NEEDED)' | grep -F 'libpcre2-posix.so.3'
          readelf -d zig-out/bin/pcre2test | grep -F '(RUNPATH)' | grep -F '$ORIGIN/../lib'

      # `pcre2test` reads its pattern file from stdin when given no file
      # argument, and prints one line per offset pair it found. The expected
      # line is worked out by hand: `(?<d>[0-9]+)-(?<w>[a-z]+)` against
      # "42-forty" matches the whole subject, group 1 is "42" at bytes [0,2)
      # and group 2 is "-forty" at bytes [2,8), so ` 2: 2-8`.
      - name: pcre2test runs from bin/ with no LD_LIBRARY_PATH
        run: |
          set -euo pipefail
          env -u LD_LIBRARY_PATH sh -c '
            printf "/(?<d>[0-9]+)-(?<w>[a-z]+)/\n  42-forty\n" \
              | zig-out/bin/pcre2test -q > "'"$RUNNER_TEMP"'/pcre2test.out"
          '
          cat "$RUNNER_TEMP/pcre2test.out"
          grep -F ' 0: 0-8' "$RUNNER_TEMP/pcre2test.out"
          grep -F ' 1: 0-2' "$RUNNER_TEMP/pcre2test.out"
          grep -F ' 2: 2-8' "$RUNNER_TEMP/pcre2test.out"

      # `pcre2grep -n pattern file` prints `line:linecontent` for each match,
      # so `beta` on the second line of a two-line file prints exactly `2:beta`.
      - name: pcre2grep runs from bin/ with no LD_LIBRARY_PATH
        run: |
          set -euo pipefail
          printf 'alpha\nbeta\n' > "$RUNNER_TEMP/grep-input.txt"
          env -u LD_LIBRARY_PATH zig-out/bin/pcre2grep -n 'bet' "$RUNNER_TEMP/grep-input.txt" \
            | tee "$RUNNER_TEMP/pcre2grep.out"
          test "$(cat "$RUNNER_TEMP/pcre2grep.out")" = '2:beta'

      - name: the manual pages and the documentation are installed
        run: |
          set -euo pipefail
          ls zig-out/share/man/man1/pcre2grep.1
          ls zig-out/share/man/man1/pcre2test.1
          ls zig-out/share/man/man3/pcre2posix.3
          ls zig-out/share/doc/pcre2/pcre2pattern.txt
          ls zig-out/share/doc/pcre2/html/pcre2pattern.html
          # Upstream's own licence and authorship records, unmodified.
          ls zig-out/share/doc/pcre2/LICENCE.md
          ls zig-out/share/doc/pcre2/COPYING
          ls zig-out/share/doc/pcre2/AUTHORS.md
          # This fork's own records, so a prefix alone still says which bytes
          # are upstream's and under what grant.
          ls zig-out/share/doc/pcre2/NOTICE.md
          ls zig-out/share/doc/pcre2/FORK-LICENSE.md
          ls zig-out/share/doc/pcre2/UPSTREAM.md

  metadata:
    name: installed pkg-config and pcre2-config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: build
        run: zig build --summary all

      # Every expectation below is read out of the templates in this
      # repository, not out of a run of a different release.
      - name: the .pc files resolve and describe what was installed
        run: |
          set -euo pipefail
          # ${pcfiledir} is absolute by definition in a .pc file, so the prefix
          # the metadata resolves to is the realpath of the install directory.
          PREFIX="$(realpath zig-out)"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"

          pkg-config --exists libpcre2-8
          pkg-config --exists libpcre2-posix

          # Version: `CMakeLists.txt:1191` and `configure.ac:10-13` both spell it
          # major.minor with no patch component.
          test "$(pkg-config --modversion libpcre2-8)" = '10.49'

          # -lpcre2-8, and a -L that resolves through ${pcfiledir}/../.. to the
          # directory the libraries were installed into.
          pkg-config --libs libpcre2-8
          pkg-config --libs libpcre2-8 | grep -F "$PREFIX/lib" | grep -F ' -lpcre2-8'

          # A shared build declares the POSIX wrapper's entry points
          # __declspec(dllimport) on Windows and plain extern elsewhere, and the
          # .pc says so the same way configure.ac:741-753 does.
          pkg-config --cflags libpcre2-posix | grep -F -- '-DPCRE2POSIX_SHARED'
          pkg-config --cflags libpcre2-8 | grep -F "$PREFIX/include"
          # ...and a shared core needs no PCRE2_STATIC.
          ! pkg-config --cflags libpcre2-8 | grep -F 'PCRE2_STATIC'

          # Requires.private is the relation between the two installed
          # artifacts: --static pulls libpcre2-8 in for a wrapper that does not
          # name it in Libs.
          pkg-config --static --libs libpcre2-posix | grep -F ' -lpcre2-8'
          # Libs.private is empty in both directions: nothing under src/ uses a
          # thread, so there is nothing private to link.
          test "$(pkg-config --static --libs libpcre2-8 | tr ' ' '\n' | grep -c -- '^-l' || true)" = '1'

      - name: pcre2-config reports the version, the libs and the enabled widths
        run: |
          set -euo pipefail
          PREFIX="$(realpath zig-out)"
          test "$(zig-out/bin/pcre2-config --version)" = '10.49'
          test "$(zig-out/bin/pcre2-config --prefix)" = "$PREFIX"

          zig-out/bin/pcre2-config --libs8 | grep -F "$PREFIX/lib" | grep -F ' -lpcre2-8'
          # --libs-posix names both artifacts, because the wrapper needs the
          # core to answer any call (pcre2-config.in, the --libs-posix branch).
          zig-out/bin/pcre2-config --libs-posix | grep -F ' -lpcre2-posix' | grep -F ' -lpcre2-8'
          zig-out/bin/pcre2-config --cflags | grep -F "$PREFIX/include"

          # This build produced only the 8-bit library, so the other two widths
          # are absent from the usage line and answering for them is an error
          # rather than a name for something that was never installed.
          ! zig-out/bin/pcre2-config --libs8 2>&1 | grep -q -- '--libs16'
          zig-out/bin/pcre2-config --libs16 && exit 1 || true

  static:
    name: static delivery (-Dlinkage=static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The default on this runner is dynamic because its libc is GNU; this job
      # names the other variant so both are built somewhere. "static" names a
      # static library artifact, not a promise about the resulting program: the
      # programs below are still dynamically linked against libc.
      - name: build
        run: zig build -Dlinkage=static --summary all

      - name: archives instead of shared objects, and no version script output
        run: |
          set -euo pipefail
          ls zig-out/lib/libpcre2-8.a
          ls zig-out/lib/libpcre2-posix.a
          test ! -e zig-out/lib/libpcre2-8.so
          # The pkg-config files, the same headers and the same programs are all
          # still installed: the linkage changes the artifact, not the closure.
          export PKG_CONFIG_PATH="$PWD/zig-out/lib/pkgconfig"
          pkg-config --exists libpcre2-8
          # A static archive must be declared plain `extern` on Windows, and the
          # .pc says so the way configure.ac:728-739 does.
          pkg-config --cflags libpcre2-8 | grep -F -- '-DPCRE2_STATIC'
          pkg-config --cflags libpcre2-posix | grep -v -- '-DPCRE2POSIX_SHARED'
          ls zig-out/include/pcre2.h
          ls zig-out/include/pcre2posix.h
          ls zig-out/bin/pcre2test
          ls zig-out/bin/pcre2grep
          ls zig-out/bin/pcre2-config

      # With no shared library there is nothing to resolve at run time, so these
      # two need no LD_LIBRARY_PATH and no runpath. Running them at all is the
      # point: a static build that only compiles would not catch a
      # PCRE2_STATIC/PCRE2POSIX_SHARED disagreement on the import lines.
      - name: pcre2test and pcre2grep run from bin/
        run: |
          set -euo pipefail
          env -u LD_LIBRARY_PATH sh -c '
            printf "/(?<d>[0-9]+)-(?<w>[a-z]+)/\n  42-forty\n" \
              | zig-out/bin/pcre2test -q > "'"$RUNNER_TEMP"'/pcre2test-static.out"
          '
          grep -F ' 2: 2-8' "$RUNNER_TEMP/pcre2test-static.out"
          printf 'alpha\nbeta\n' > "$RUNNER_TEMP/grep-input.txt"
          test "$(env -u LD_LIBRARY_PATH zig-out/bin/pcre2grep -n 'bet' "$RUNNER_TEMP/grep-input.txt")" = '2:beta'

      - name: test and smoke in the static configuration
        run: |
          zig build test -Dlinkage=static --summary all
          zig build smoke -Dlinkage=static --summary all

  widths:
    name: ${{ matrix.width }}-bit delivery
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        width: ['16', '32']
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # `-Dcode-unit-width` selects upstream's library of that width and installs
      # it whole. The POSIX wrapper, `pcre2demo`, `pcre2posix_test` and
      # libpcre2-posix.pc are absent here and the row asserts that, because
      # upstream's POSIX emulation is an 8-bit program by its own source
      # (`src/pcre2posix.h` regmatch_t counts bytes).
      - name: build
        run: zig build -Dcode-unit-width=${{ matrix.width }} --summary all

      - name: that width's library, header, .pc and programs are installed
        run: |
          set -euo pipefail
          W=${{ matrix.width }}
          ls "zig-out/lib/libpcre2-$W.so.0.16.1"
          ls zig-out/lib/pkgconfig/libpcre2-$W.pc
          ls zig-out/include/pcre2.h
          ls zig-out/bin/pcre2test
          ls zig-out/bin/pcre2-config

          export PKG_CONFIG_PATH="$PWD/zig-out/lib/pkgconfig"
          pkg-config --exists "libpcre2-$W"
          pkg-config --exists libpcre2-8 && exit 1 || true
          test -z "$(ls zig-out/lib/libpcre2-posix.* 2>/dev/null || true)"
          # `Makefile.am` builds pcre2grep, pcre2posix_test and the POSIX
          # wrapper only under `WITH_PCRE2_8`, and `src/pcre2grep.c:110`
          # hard-codes `#define PCRE2_CODE_UNIT_WIDTH 8` besides.
          test ! -e zig-out/bin/pcre2grep
          test ! -e zig-out/bin/pcre2posix_test

          # pcre2-config names the width it built and refuses the others.
          zig-out/bin/pcre2-config --libs"$W" | grep -F " -lpcre2-$W"
          zig-out/bin/pcre2-config --libs8 2>/dev/null && exit 1 || true

      # The facade resolves to the width this build compiled, so `test`, `smoke`
      # and `check` all run at this width rather than refusing. That is the point
      # of this step: it is the first gate that exercises the 16- and 32-bit
      # facades at all, and `check` covers the six cross targets for them too.
      - name: test and smoke run at this width
        run: |
          zig build test -Dcode-unit-width=${{ matrix.width }} --summary all
          zig build smoke -Dcode-unit-width=${{ matrix.width }} --summary all

  upstream-suite:
    name: upstream's own RunTest suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The authority on whether this fork's core still behaves like PCRE2.
      # `tests.zig` replays a slice of upstream's own testdata through the Zig
      # facade; this drives upstream's own `pcre2test` through all of it and
      # diffs against upstream's own `testoutput*`, with `diff` deciding.
      #
      # JIT is off in this build, and RunTest knows that: it selects test 16
      # ("JIT-specific features when JIT is not available") over test 17 and
      # skips the JIT modes of every other test, so this is the whole suite this
      # configuration can run and not a subset chosen here.
      - name: upstream-test
        run: zig build upstream-test --summary all

  cross:
    name: check ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - aarch64-macos-none
          - x86_64-windows-gnu
          - riscv64-linux-gnu
          - wasm32-wasi
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # `check` compiles the C core, the facade, `tests.zig` and `smoke.zig` for
      # the given target and runs nothing. An explicit -Dtarget narrows the
      # matrix to exactly that target, which is why this is one job per target
      # rather than one job building all six: a matrix row that silently
      # checked nothing would still be green.
      - name: Compile the C core, the facade, the tests and the smoke
        run: zig build check -Dtarget=${{ matrix.target }} --summary all

  system:
    name: system library (-fsys=pcre2-8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The point of this job is that the installed library is not this tree's
      # library. The runner ships whatever its image pinned, and this fork pins
      # 10.49, so a translation built here against the installed <pcre2.h> and
      # linked against the installed libpcre2-8 is a real cross-implementation
      # check rather than a restatement of the bundled build.
      - name: Install the PCRE2 8-bit development package
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcre2-dev
          # Report what was installed rather than asserting a version: the point
          # is that it is not the tree's, not which release the image pinned.
          pkg-config --modversion libpcre2-8

      # What this step binds, and what it does not. The fixture table in
      # `testdata/foundation-fixtures.zig` is upstream's own `pcre2test` input and
      # expected output for release 10.49, the release this tree is a fork of, so
      # three of its cases pin a compile rejection that 10.49 produces: error
      # 122 at offset 1, error 106 at offset 4 and error 142 at offset 6, each
      # with its exact message text. Two more pin hand-derived
      # `src/pcre2_valid_utf.c` paths. An installed PCRE2 of another release can
      # answer one of those differently, and that is a real difference between
      # two releases rather than a fault in this binding. Read a red step here
      # against the version the step above printed, and never by loosening a
      # fixture.
      - name: test against the installed library
        run: zig build test -fsys=pcre2-8 --summary all

      # Release-independent by construction: `smoke.zig` compares byte offsets
      # worked out by hand from the subject strings it prints, so an installed
      # release can move them only by changing what a match means. This is the
      # cross-implementation signal that does not depend on which release the
      # image happened to pin.
      - name: smoke against the installed library
        run: zig build smoke -fsys=pcre2-8 --summary all

  consumer:
    name: consumer package (${{ matrix.linkage || 'default' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - linkage: ''
            runtime: ''
          - linkage: '-Dlinkage=static'
            runtime: ''
          - linkage: '-Dlinkage=dynamic'
            runtime: ''
          # The runtime-loaded dispatch, under each linkage: the option is
          # orthogonal to the other, so both facts are proved together rather
          # than one at a time. This row builds and installs the real native
          # artifact exactly as the linked rows do - delivery is not what
          # -Druntime changes - and it proves the module links no library,
          # because a consumer that resolved its symbols statically would still
          # produce the same output.
          - linkage: '-Dlinkage=static'
            runtime: '-Druntime=true'
          - linkage: '-Dlinkage=dynamic'
            runtime: '-Druntime=true'
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The failure this catches is the one the library's own tests cannot see:
      # a module that builds from the inside and does not resolve from outside.
      # `dep.module("pcre2")` carries the compiled core with it, so this also
      # proves that a dependent needs no path into this repository's tree.
      #
      # In the two shared rows the resolution happens at run time, by soname,
      # through the platform loader: the module carries the build cache's entry,
      # the cache directory `linkLibrary` recorded when the dependency linked
      # its own shared object, so this program finds *this* build's
      # `libpcre2-8.so.0` and not whatever the runner has in `/lib64`. The
      # program's second line prints the version the library reports about
      # itself, so a run that resolved a system library instead would say so
      # rather than pass quietly.
      #
      # `-Dlinkage` is read in `consumer/build.zig` and forwarded to the
      # dependency unchanged, so an unset value leaves the library's own default
      # (dynamic on a GNU libc target, static elsewhere) in place and the other
      # two rows name each variant explicitly.
      - name: run
        working-directory: consumer
        run: zig build run ${{ matrix.linkage }} ${{ matrix.runtime }} --summary all
